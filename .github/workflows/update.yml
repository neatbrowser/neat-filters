name: update

on:
  schedule:
    # Every 6 hours, off the top of the hour (GitHub delays jobs queued at :00).
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish a release even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/nf-tool/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/nf-tool/Cargo.lock') }}

      - name: Unit tests
        run: node --test scripts/*.test.mjs

      - name: Fetch previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download --pattern manifest.json --dir prev || echo "No previous release (first run)"

      - name: Build
        id: build
        run: node scripts/build.mjs --prev prev/manifest.json ${{ inputs.force && '--force' || '' }}

      - name: Publish release
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          # Create as a draft, upload everything, then publish, so clients that poll
          # releases/latest never see a release with missing files.
          gh release create "v$VERSION" \
            dist/manifest.json dist/resources.json dist/*.txt \
            --draft --title "neat-filters $VERSION" --notes-file .cache/release-notes.md
          gh release edit "v$VERSION" --draft=false --latest

      - name: Prune old releases (keep the newest 30)
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not)] | .[30:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Keepalive
        # GitHub disables scheduled workflows in repos with no activity for 60 days.
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
